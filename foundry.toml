[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test/foundry'
cache_path = 'cache_forge'
solc_version = '0.8.28'
optimizer = true
optimizer_runs = 10
via_ir = false
evm_version = 'paris'

[profile.default.fuzz]
runs = 10000
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 15
fail_on_revert = true
